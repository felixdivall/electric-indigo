<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d2b55"/>
      <stop offset="0.55" stop-color="#191830"/>
      <stop offset="1" stop-color="#15152b"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.55" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A599E9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A599E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFF6B0"/>
      <stop offset="0.45" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#FFAB31"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <mask id="moon">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="152" cy="132" r="64" fill="#000"/>
    </mask>
  </defs>

  <!-- Night sky tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#halo)"/>

  <!-- Crescent moon (Noctis) -->
  <circle cx="122" cy="150" r="60" fill="#A599E9" opacity="0.9" mask="url(#moon)"/>

  <!-- Stars -->
  <g fill="#E1EFFF">
    <circle cx="410" cy="110" r="5"/>
    <circle cx="372" cy="70" r="3" opacity="0.7"/>
    <circle cx="430" cy="392" r="4" opacity="0.8"/>
    <circle cx="96" cy="400" r="3" opacity="0.6"/>
    <circle cx="200" cy="72" r="2.5" opacity="0.6"/>
  </g>

  <!-- Lightning bolt: glow, then body -->
  <path id="b" d="M318 56 L150 300 L248 300 L200 460 L378 200 L276 200 Z" fill="#FFD700" filter="url(#glow)" opacity="0.75"/>
  <path d="M318 56 L150 300 L248 300 L200 460 L378 200 L276 200 Z" fill="url(#bolt)" stroke="#FFF6B0" stroke-width="6" stroke-linejoin="round"/>
</svg>
